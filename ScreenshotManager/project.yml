name: ScreenshotManager
options:
  bundleIdPrefix: com.panev
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ScreenshotManager:
    type: application
    platform: iOS
    sources:
      - ScreenshotManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panev.ScreenshotManager
        PRODUCT_NAME: Screenshot Manager
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Screenshots
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Screenshot Manager reads your screenshots so new ones appear in Recent automatically and you can sort them into albums.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
